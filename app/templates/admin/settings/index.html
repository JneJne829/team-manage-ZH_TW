{% extends "base.html" %}

{% block title %}系統設定 - GPT Team 管理系統{% endblock %}

{% block content %}
<div class="page-header">
    <h2>系統設定</h2>
</div>

<!-- Proxy 設定 -->
<div class="content-section">
    <div class="section-header">
        <h3>代理設定</h3>
    </div>

    <form id="proxyForm" class="settings-form">
        <div class="form-group">
            <label class="checkbox-label">
                <input type="checkbox" id="proxyEnabled" name="enabled" {% if proxy_enabled %}checked{% endif %}>
                <span>啟用代理</span>
            </label>
            <p class="form-help">啟用後，呼叫 ChatGPT API 時將透過此代理。</p>
        </div>

        <div class="form-group">
            <label for="proxyUrl">代理網址</label>
            <input type="text" id="proxyUrl" name="proxy" value="{{ proxy or '' }}"
                placeholder="http://127.0.0.1:7890 或 socks5://127.0.0.1:1080"
                class="form-control">
            <p class="form-help">支援 HTTP、SOCKS5、SOCKS5H (可解析 DNS)。</p>
        </div>

        <button type="submit" class="btn btn-primary">儲存代理設定</button>
    </form>
</div>

<!-- 變更密碼 -->
<div class="content-section">
    <div class="section-header">
        <h3>變更密碼</h3>
    </div>

    <form id="passwordForm" class="settings-form">
        <div class="form-group">
            <label for="oldPassword">舊密碼</label>
            <input type="password" id="oldPassword" name="old_password" required class="form-control"
                placeholder="請輸入目前密碼">
        </div>

        <div class="form-group">
            <label for="newPassword">新密碼</label>
            <input type="password" id="newPassword" name="new_password" required minlength="6" class="form-control"
                placeholder="至少 6 個字元">
        </div>

        <div class="form-group">
            <label for="confirmPassword">確認新密碼</label>
            <input type="password" id="confirmPassword" name="confirm_password" required minlength="6"
                class="form-control" placeholder="再次輸入新密碼">
        </div>

        <button type="submit" class="btn btn-primary">更新密碼</button>
        <p class="form-help">更新後需使用新密碼登入。</p>
    </form>
</div>

<!-- 日誌等級 -->
<div class="content-section">
    <div class="section-header">
        <h3>日誌等級</h3>
    </div>

    <form id="logLevelForm" class="settings-form">
        <div class="form-group">
            <label for="logLevel">日誌等級</label>
            <select id="logLevel" name="level" class="form-control">
                <option value="DEBUG" {% if log_level=='DEBUG' %}selected{% endif %}>DEBUG - 除錯詳情</option>
                <option value="INFO" {% if log_level=='INFO' %}selected{% endif %}>INFO - 基本資訊</option>
                <option value="WARNING" {% if log_level=='WARNING' %}selected{% endif %}>WARNING - 警告</option>
                <option value="ERROR" {% if log_level=='ERROR' %}selected{% endif %}>ERROR - 錯誤</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">儲存等級</button>
    </form>
</div>
{% endblock %}

{% block extra_css %}{% endblock %}
{% block extra_js %}{% endblock %}
